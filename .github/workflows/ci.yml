name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get an accurate list of changed files for Super-Linter
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enable only relevant linters for this project
          VALIDATE_TYPESCRIPT_ESLINT: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JSON: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_YAML: true

  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev build-essential

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          NFC__MODE: mock
        run: npm test

      - name: Compile Backend
        run: npm run build

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile Frontend
        run: |
          cd frontend
          npm run build
